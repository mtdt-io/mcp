name: Publish VS Code extension

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: test "vscode-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx -y @vscode/vsce@4 package --out mtdt.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/mtdt.vsix

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @vscode/vsce@4 publish --oidc --skip-duplicate --packagePath mtdt.vsix

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y ovsx@1 publish --skip-duplicate --packagePath mtdt.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
